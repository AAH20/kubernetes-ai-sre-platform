name: Kubernetes AI SRE Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m kube_ai_sre.cli scenarios/deployment-auth-regression.json --output kubernetes-ai-sre-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-kubernetes-ai-sre-report
          path: kubernetes-ai-sre-report.json
